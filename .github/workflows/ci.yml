name: Verify Sellora
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check && npm run test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: PostgreSQL policy harness (not full Supabase)
        run: |
          docker run -d --name sellora-test-db -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=sellora postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec sellora-test-db pg_isready -U postgres; then break; fi
            sleep 1
          done
          npm run db:test:postgres
      - run: npm audit --omit=dev
